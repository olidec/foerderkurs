# ===========================================================================
# Strang 6: Gleichungen
# ---------------------------------------------------------------------------
# Felder:  6A Gleichheit und Lösung   6B lineare Gleichungen mit Zahlen
#          6C Gleichungen mit Brüchen 6D Formeln, Parameter, Lösungsmengen
# ===========================================================================
strang: 6
titel: Gleichungen
aufgaben:

# ---------------------------------------------------------------- 6A ------
- id: 6A-01
  stufe: 1
  typ: Routine
  ml: "0.1"
  raum: 2
  aufgabe: |
    Welche Zahl gehört ins Kästchen?
    \begin{multicols}{3}\begin{parts}
      \part $9 + 6 = \kaestchen + 8$
      \part $5 \cdot \kaestchen = 45 \geteilt 3$
      \part $\kaestchen - 4 = 20 - 10$
    \end{parts}\end{multicols}
  loesung: |
    a) $7$ \quad b) $3$ \quad c) $14$
  fehler:
    - antwort: '$15$ bei a)'
      hinweis: 'Das Gleichheitszeichen heisst «hat denselben Wert wie», nicht «jetzt kommt das Ergebnis». Mini-Lektion 0.1.'

- id: 6A-02
  stufe: 2
  typ: Verständnis
  ml: "0.1"
  raum: 3
  aufgabe: |
    Wahr oder falsch? Entscheiden Sie \textbf{ohne} auszurechnen und
    begründen Sie.
    \begin{parts}
      \part $38 + 47 = 40 + 45$ \hfill \wahlr{wahr}\quad \wahl{falsch}
      \part $81 - 36 = 80 - 35$ \hfill \wahlr{wahr}\quad \wahl{falsch}
      \part $12 \cdot 15 = 6 \cdot 30$ \hfill \wahlr{wahr}\quad \wahl{falsch}
      \part $96 \geteilt 8 = 48 \geteilt 16$ \hfill \wahl{wahr}\quad \wahlr{falsch}
    \end{parts}
  loesung: |
    a) wahr \quad b) wahr \quad c) wahr \quad d) falsch
  weg: |
    d) Halbiert man den Dividenden, muss man auch den Divisor halbieren
    ($48 \geteilt 4$), nicht verdoppeln. Tatsächlich ist $12 \neq 3$.

- id: 6A-03
  stufe: 1
  typ: Text
  ml: "6.1"
  raum: 2.5
  aufgabe: |
    Ich denke mir eine Zahl, verdopple sie und addiere $3$. Ich erhalte $17$.
    Welche Zahl habe ich mir gedacht? Lösen Sie durch Rückwärtsrechnen.
  loesung: |
    $7$ \ (rückwärts: $17 - 3 = 14$, \ $14 \geteilt 2 = 7$)

- id: 6A-04
  stufe: 2
  typ: Verständnis
  ml: "6.2"
  raum: 2.5
  aufgabe: |
    Prüfen Sie durch Einsetzen.
    \begin{parts}
      \part Ist $x = 4$ eine Lösung von $3x + 2 = 14$?
      \part Ist $x = 4$ eine Lösung von $2x - 1 = 9$?
    \end{parts}
  loesung: |
    a) ja, $3 \cdot 4 + 2 = 14$ \quad b) nein, $2 \cdot 4 - 1 = 7 \neq 9$

- id: 6A-05
  stufe: 2
  typ: Check
  ml: "0.1"
  raum: 2.5
  aufgabe: |
    \begin{parts}
      \part Welche Zahl gehört ins Kästchen? \quad $14 + 9 = \kaestchen + 10$
      \part Wahr oder falsch, ohne zu rechnen? \quad $25 \cdot 12 = 50 \cdot 6$
      \part Ist $x = 3$ eine Lösung von $5x - 4 = 11$?
    \end{parts}
  loesung: |
    a) $13$ \quad b) wahr \quad c) ja

# ---------------------------------------------------------------- 6B ------
- id: 6B-01
  stufe: 1
  typ: Routine
  ml: "6.1"
  raum: 3
  aufgabe: |
    Lösen Sie die Gleichungen. Geben Sie die Umformungen rechts an.
    \begin{multicols}{4}\begin{parts}
      \part $x + 9 = 4$
      \part $7x = 42$
      \part $\dfrac{x}{4} = 3$
      \part $15 = x - 6$
    \end{parts}\end{multicols}
  loesung: |
    a) $x = -5$ \quad b) $x = 6$ \quad c) $x = 12$ \quad d) $x = 21$

- id: 6B-02
  stufe: 2
  typ: Routine
  ml: "6.1"
  raum: 4
  aufgabe: |
    Lösen Sie die Gleichungen.
    \begin{multicols}{2}\begin{parts}
      \part $3x + 7 = 22$
      \part $5x - 8 = 2x + 7$
      \part $18 = 4x + 2$
      \part $9 - 2x = 3$
    \end{parts}\end{multicols}
  loesung: |
    a) $x = 5$ \quad b) $x = 5$ \quad c) $x = 4$ \quad d) $x = 3$
  fehler:
    - antwort: '$x = -3$ bei d)'
      hinweis: 'Vorzeichenfehler: Aus $-2x = -6$ folgt $x = 3$. Probe machen! Mini-Lektion 6.1.'

- id: 6B-03
  stufe: 2
  typ: Routine
  ml: "6.2"
  raum: 4
  aufgabe: |
    Lösen Sie die Gleichungen.
    \begin{multicols}{3}\begin{parts}
      \part $2 \cdot (x + 3) = 14$
      \part $4 \cdot (x - 1) = 2x + 6$
      \part $3 - (x - 4) = 2$
    \end{parts}\end{multicols}
  loesung: |
    a) $x = 4$ \quad b) $x = 5$ \quad c) $x = 5$
  weg: |
    c) $3 - x + 4 = 2$, \ $7 - x = 2$, \ $x = 5$
  fehler:
    - antwort: '$x = -3$ bei c)'
      hinweis: 'Ein Minus vor der Klammer ändert \emph{alle} Vorzeichen in der Klammer: $-(x - 4) = -x + 4$. Mini-Lektion 6.2.'

- id: 6B-04
  stufe: 2
  typ: Fehlersuche
  ml: "6.1"
  raum: 3
  aufgabe: |
    Finden Sie den Fehler und lösen Sie die Gleichung richtig.
    \begin{align*}
      7 - 2x &= 1  \umf{-7} \\
      -2x    &= -6 \umf{\geteilt (-2)} \\
      x      &= -3
    \end{align*}
  loesung: |
    Der Fehler liegt in der letzten Zeile: $-6 \geteilt (-2) = 3$. Richtig ist
    $x = 3$. Probe: $7 - 2 \cdot 3 = 1$.

- id: 6B-05
  stufe: 3
  typ: Routine
  ml: "6.1"
  raum: 3
  aufgabe: |
    Lösen Sie die Gleichungen.
    \begin{multicols}{2}\begin{parts}
      \part $0.5x + 1.2 = 3.7$
      \part $1.5x - 0.5 = x + 2$
    \end{parts}\end{multicols}
  loesung: |
    a) $x = 5$ \quad b) $x = 5$

- id: 6B-06
  stufe: 2
  typ: Text
  ml: "6.1"
  raum: 3
  aufgabe: |
    Drei aufeinanderfolgende ganze Zahlen ergeben zusammen $72$. Stellen Sie
    eine Gleichung auf und bestimmen Sie die drei Zahlen.
  loesung: |
    $x + (x + 1) + (x + 2) = 72$, \ $x = 23$. Die Zahlen sind $23$, $24$ und
    $25$.

- id: 6B-07
  stufe: 2
  typ: Check
  ml: "6.1"
  raum: 3.5
  aufgabe: |
    Lösen Sie die Gleichungen.
    \begin{multicols}{3}\begin{parts}
      \part $4x - 3 = 17$
      \part $6x + 1 = 2x + 13$
      \part $3 \cdot (x - 2) = 9$
    \end{parts}\end{multicols}
  loesung: |
    a) $x = 5$ \quad b) $x = 3$ \quad c) $x = 5$

# ---------------------------------------------------------------- 6C ------
- id: 6C-01
  stufe: 2
  typ: Routine
  ml: "6.2"
  bruecke: 3C-01
  raum: 4
  aufgabe: |
    Lösen Sie die Gleichungen.
    \begin{multicols}{3}\begin{parts}
      \part $\dfrac{x}{2} + \dfrac{x}{3} = 10$
      \part $\dfrac{x}{4} - \dfrac{x}{6} = 1$
      \part $\dfrac{x + 1}{4} = 2$
    \end{parts}\end{multicols}
  loesung: |
    a) $x = 12$ \quad b) $x = 12$ \quad c) $x = 7$
  weg: |
    a) Mit $6$ multiplizieren: $3x + 2x = 60$, \ $x = 12$. \quad
    b) Mit $12$ multiplizieren: $3x - 2x = 12$.
  fehler:
    - antwort: '$x = 2$ bei a)'
      hinweis: 'Vermutlich $\frac{x}{2} + \frac{x}{3} = \frac{2x}{5}$ gerechnet. Brüche addieren wie in Aufgabe 3C-01. Mini-Lektion 3.1.'

- id: 6C-02
  stufe: 3
  typ: Routine
  ml: "6.2"
  raum: 4
  aufgabe: |
    Lösen Sie die Gleichungen.
    \begin{multicols}{2}\begin{parts}
      \part $\dfrac{x + 1}{4} = \dfrac{x - 2}{3}$
      \part $\dfrac{2x - 1}{3} - \dfrac{x}{2} = 1$
    \end{parts}\end{multicols}
  loesung: |
    a) $x = 11$ \quad b) $x = 8$
  weg: |
    a) Mit $12$ multiplizieren: $3 \cdot (x + 1) = 4 \cdot (x - 2)$,
    \ $3x + 3 = 4x - 8$, \ $x = 11$. \quad
    b) Mit $6$ multiplizieren: $2 \cdot (2x - 1) - 3x = 6$, \ $x - 2 = 6$,
    \ $x = 8$.
  fehler:
    - antwort: '$x = 7$ bei b)'
      hinweis: 'Beim Multiplizieren wurde die Klammer vergessen: $2 \cdot (2x - 1) = 4x - 2$, nicht $4x - 1$. Mini-Lektion 6.2.'

- id: 6C-03
  stufe: 2
  typ: Verständnis
  ml: "6.2"
  raum: 2.5
  aufgabe: |
    Prüfen Sie, \textbf{ohne} die Gleichung zu lösen, ob $x = 3$ eine Lösung
    der folgenden Gleichung ist.
    \[ \frac{x}{3} + 2 = \frac{x + 9}{4} \]
  loesung: |
    Ja: Links ergibt sich $1 + 2 = 3$, rechts $\frac{12}{4} = 3$.

- id: 6C-04
  stufe: 2
  typ: Fehlersuche
  ml: "6.2"
  raum: 3
  aufgabe: |
    Finden Sie den Fehler und lösen Sie die Gleichung richtig.
    \begin{align*}
      \frac{x}{2} + 3 &= 5  \umf{\cdot 2} \\
      x + 3           &= 10 \umf{-3} \\
      x               &= 7
    \end{align*}
  loesung: |
    Beim Multiplizieren mit $2$ muss \emph{jeder} Summand multipliziert werden:
    $x + 6 = 10$, also $x = 4$. Probe: $\frac{4}{2} + 3 = 5$.

- id: 6C-05
  stufe: 3
  typ: Text
  ml: "6.2"
  raum: 4
  aufgabe: |
    Von einer Strecke legt Sara einen Drittel zu Fuss und einen Viertel mit
    dem Velo zurück. Die restlichen $10$\,km fährt sie mit dem Bus. Wie lang
    ist die ganze Strecke?
  loesung: |
    $\frac{x}{3} + \frac{x}{4} + 10 = x$, \ $x = 24$. Die Strecke ist
    $24$\,km lang.
  weg: |
    Mit $12$ multiplizieren: $4x + 3x + 120 = 12x$, \ $120 = 5x$, \ $x = 24$.
    Probe: $8 + 6 + 10 = 24$.

- id: 6C-06
  stufe: 2
  typ: Check
  ml: "6.2"
  raum: 3.5
  aufgabe: |
    Lösen Sie die Gleichungen.
    \begin{multicols}{3}\begin{parts}
      \part $\dfrac{x}{3} + \dfrac{x}{6} = 4$
      \part $\dfrac{x - 2}{5} = 3$
      \part $\dfrac{x}{2} - 1 = \dfrac{x}{4}$
    \end{parts}\end{multicols}
  loesung: |
    a) $x = 8$ \quad b) $x = 17$ \quad c) $x = 4$

# ---------------------------------------------------------------- 6D ------
- id: 6D-01
  stufe: 2
  typ: Routine
  ml: "6.2"
  raum: 3
  aufgabe: |
    Lösen Sie nach der angegebenen Variablen auf.
    \begin{multicols}{3}\begin{parts}
      \part $A = \frac{1}{2} \cdot g \cdot h$ \ nach $g$
      \part $v = \dfrac{s}{t}$ \ nach $t$
      \part $U = 2 \cdot (a + b)$ \ nach $b$
    \end{parts}\end{multicols}
  loesung: |
    a) $g = \frac{2A}{h}$ \quad b) $t = \frac{s}{v}$ \quad
    c) $b = \frac{U}{2} - a$

- id: 6D-02
  stufe: 3
  typ: Routine
  ml: "6.2"
  raum: 3
  aufgabe: |
    Lösen Sie nach $x$ auf.
    \begin{multicols}{2}\begin{parts}
      \part $ax + 3 = 7$ \quad ($a \neq 0$)
      \part $ax = bx + c$ \quad ($a \neq b$)
    \end{parts}\end{multicols}
  loesung: |
    a) $x = \frac{4}{a}$ \quad b) $x = \frac{c}{a - b}$
  weg: |
    b) $ax - bx = c$, \ $x \cdot (a - b) = c$, \ $x = \frac{c}{a - b}$
  fehler:
    - antwort: 'bei b) keinen Ansatz gefunden'
      hinweis: 'Alle Summanden mit $x$ auf eine Seite bringen und dann $x$ ausklammern. Mini-Lektion 5.3.'

- id: 6D-03
  stufe: 3
  typ: Verständnis
  ml: "6.2"
  raum: 3
  aufgabe: |
    Bestimmen Sie die Lösungsmenge.
    \begin{multicols}{2}\begin{parts}
      \part $3 \cdot (x - 1) = 3x - 3$
      \part $2x + 1 = 2x + 4$
    \end{parts}\end{multicols}
  loesung: |
    a) $\mathbb{L} = \mathbb{R}$ \quad b) $\mathbb{L} = \{\,\}$
  weg: |
    a) Die Gleichung ist für jedes $x$ wahr ($0 = 0$). \quad
    b) Es entsteht $1 = 4$, also gibt es keine Lösung.
